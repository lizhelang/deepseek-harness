# Test-only overlay; shipped headless bundles supply the actual runtime.
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: agent-loop
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()
- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
- id: storage-json
  config:
    root: './.state'
- insert:
    - id: cli-mock-llm
      name: '../../../../test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'
    - id: production-studio
      name: '@deepseek-ai/dsh-production-studio'
    - id: seed-production
      name: './seed-production.ts'
